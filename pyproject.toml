[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-deepseek-userbot"
version = "0.1.0"
description = "A safety-first Telegram personal-account assistant powered by DeepSeek"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "XiaoShuonb" }]
keywords = ["telegram", "deepseek", "playwright", "assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.55,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/XiaoShuonb/telegram-web-deepseek-assistant"
Repository = "https://github.com/XiaoShuonb/telegram-web-deepseek-assistant"
Issues = "https://github.com/XiaoShuonb/telegram-web-deepseek-assistant/issues"

[project.scripts]
tgdeepseek = "tgdeepseek.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

